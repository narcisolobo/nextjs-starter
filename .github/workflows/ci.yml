name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # A major release can break tooling without failing the install
      # (TypeScript 7 broke typescript-eslint), so check peers explicitly.
      - run: pnpm peers check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
